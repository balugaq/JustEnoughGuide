houbbNlpCommon = "0.0.5"

[libraries]
# 编译仅依赖
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paperApi" }
slimefun4 = { module = "com.github.SlimefunGuguProject:Slimefun4", version.ref = "slimefun4" }
findbugs-annotations = { module = "com.google.code.findbugs:annotations", version.ref = "findbugsAnnotations" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
# JitPack工具类
anvilgui = { module = "com.github.balugaq:AnvilGUI", version.ref = "anvilgui" }
# Shadow内嵌依赖
bstats-bukkit = { module = "org.bstats:bstats-bukkit", version.ref = "bstatsBukkit" }
more-persistent-data-types = { module = "com.jeff-media:MorePersistentDataTypes", version.ref = "morePersistentDataTypes" }
folia-lib = { module = "com.tcoded:FoliaLib", version.ref = "foliaLib" }
libby-bukkit = { module = "net.byteflux:libby-bukkit", version.ref = "libbyBukkit" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrainsAnnotations" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
# Houbb系列
houbb-pinyin = { module = "com.github.houbb:pinyin", version.ref = "houbbPinyin" }
houbb-opencc4j = { module = "com.github.houbb:opencc4j", version.ref = "houbbOpencc4j" }
houbb-heaven = { module = "com.github.houbb:heaven", version.ref = "houbbHeaven" }
houbb-nlp-common = { module = "com.github.houbb:nlp-common", version.ref = "houbbNlpCommon" }
# 插件依赖
guizhan-lib = { module = "net.guizhanss:GuizhanLibPlugin", version.ref = "guizhanLibPlugin" }
slimefun-translation = { module = "net.guizhanss:SlimefunTranslation", version.ref = "slimefunTranslation" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
networks-expansion = { module = "com.github.ytdd9527:NetworksExpansion", version.ref = "networksExpansion" }
slime-ae = { module = "com.github.balugaq:SlimeAE", version.ref = "slimeAE" }
cmi-lib = { module = "com.github.Zrips:CMILib", version.ref = "cmiLib" }
gugu-slimefun-lib = { module = "com.github.TimetownDev:GuguSlimefunLib", version.ref = "guguSlimefunLib" }
emc-tech = { module = "com.github.balugaq:EMCTech", version.ref = "emcTech" }
slime-hud = { module = "com.github.balugaq:SlimeHUD", version.ref = "slimeHUD" }
slimefun-recipe = { module = "com.github.balugaq:SlimeFunRecipe", version.ref = "slimeFunRecipe" }
ryken-slime-customizer = { module = "com.github.balugaq:RykenSlimeCustomizer", version.ref = "rykenSlimeCustomizer" }

[plugins]
shadow-jar = { id = "com.gradleup.shadow", version.ref = "shadow" }