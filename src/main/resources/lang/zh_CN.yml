  taken-over: "&e[JustEnoughGuide] JustEnoughGuide 已接管 {0} 指令的执行。如出现 bug，请反馈至 https://github.com/balugaq/JustEnoughGuide"
  companion-unbanned: "&a[JustEnoughGuide] 已解禁配方补全伴生物品 {0}."
  companion-unbanned-prefix: "[JustEnoughGuide] 已解禁配方补全伴生物品 "
  # {0}: 数量
  companion-unbanned-all: "&a[JustEnoughGuide] 已解禁 {0} 个配方补全伴生物品."
  companion-already-unbanned-all: "&c[JustEnoughGuide] {0} 个配方补全伴生物品均已是解禁状态."
  item-already-unbanned: "&c[JustEnoughGuide] 物品 {0} 已是解禁状态."
  item-already-unbanned-prefix: "[JustEnoughGuide] 物品 "
  item-already-unbanned-suffix: " 已是解禁状态."
  item-unbanned: "&a[JustEnoughGuide] 已解禁物品 {0}."
  item-unbanned-prefix: "[JustEnoughGuide] 已解禁物品 "
  companion-banned: "&a[JustEnoughGuide] 已禁用配方补全伴生物品 {0}."
  companion-banned-prefix: "[JustEnoughGuide] 已禁用配方补全伴生物品 "
  companion-banned-all: "&a[JustEnoughGuide] 已禁用 {0} 个配方补全伴生物品."
  companion-already-banned-all: "&c[JustEnoughGuide] {0} 个配方补全伴生物品均已是禁用状态."
  item-already-banned: "&c[JustEnoughGuide] 物品 {0} 已经是禁用状态."
  item-already-banned-prefix: "[JustEnoughGuide] 物品 "
