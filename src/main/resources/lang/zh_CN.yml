# ============================================================================
#  JustEnoughGuide 语言文件（zh_CN）
# ============================================================================
# 说明：
#   - config.yml 里的 `language: zh_CN` 决定加载哪个语言文件（对应本目录下的 <language>.yml）。
#   - 插件首次启动时会把内置语言文件原样复制到 plugins/JustEnoughGuide/lang/ 下；
#     之后以磁盘上的文件为准，插件内置的版本只作为缺键兜底，不会被改写。
#   - 颜色代码用 &（如 &a 绿色），占位符用 {0} {1} ...，按 sendMessage/t 传入的参数顺序替换；
#     参数不足时占位符原样保留。
#   - 文本里的单引号、双引号等字符可以直接写，不需要转义。
#   - icons 节点（供 Lang.getIcon 使用）：
#       icons:
#         example:
#           material: BOOK   # 可选，默认 PAPER；须为有效的原版材质名
#           name: "&b示例图标"
#           lore: |-         # 支持 |- 多行字符串，也支持 - 列表写法
#             第一行
#             第二行
#   - 命名约定：
#       * 带 *-prefix / *-suffix 后缀的键用于 Adventure 组件拼装（纯文本，不带颜色码，
#         颜色由代码里的 NamedTextColor 指定）；同名无后缀的键是 legacy 通道（含颜色码）的整句版本。
# ============================================================================

commands:
  help:
    - "&aJEG Commands:"
    - "&a/jeg help - Show this help message"
    - "&a/jeg reload - Reload JEG plugin"
    - "&a/jeg cache <section> <key>"
    - "&a/jeg disable - Disable JEG plugin"
    - "&a/jeg gteg - Get Guide Tier Editor"
    - "&a/jeg categories - View all the groups"
    - "&a/jeg share - Share the item on your hand"
    - "&a/jeg viewitem <Slimefun Item> - View Slimefun item"
    - "&a/jeg search [item name] - Search item on hand or search your input"
    - "&a/jeg timings - View Slimefun machine performance"
  timings:
    # {0}: 详细模式后缀（详细模式为“（详细模式）”，否则为空）
    collecting: "&e[JustEnoughGuide] 正在采集性能数据{0}..."
    unavailable: "&c性能监视器不可用，请稍后再试"
    verbose-suffix: "（详细模式）"
  # {0}: 物品 ID
  cannot-view-item: "&c无法查看 ID 为 {0} 的物品"
  put-item-on-hand: "&c请将物品放在手上"
  must-hold-item: "&c你必须手持一个物品在手上"

guide:
  no-bookmark: "&c你还没有收藏任何物品!"
  # {0}: 物品组显示名
  group-selected: "&a已选择物品组: &e{0}"
  group-selected-for-swap: "&a已选择待交换的物品组: &e{0}"
  group-bookmarked: "&a已收藏物品组: &e{0}"
  # {0} {1}: 交换前后的物品组显示名
  group-swapped: "&a已交换物品组排序: &e{0} &7<-> &e{1}"
  internal-error: "&4服务器发生了一个内部错误. 请联系管理员处理."
  settings-disabled-in-mode: "&c当前模式下不能打开设置界面!"
  too-frequent: "&c你的使用频率过高，请稍后使用!"
  cooldown: "&c这个功能正在冷却中..."
  # {0}: 按键名
  key-not-found: "&c未找到按键: {0}"
  added-to-bookmark: "&a已添加到收藏列表!"
  no-permission-guide: "&c你没有权限打开粘液科技指南书"
  jeg-module-disabled: "&cJEG 模块未启用。你不能打开 JEG 使用指南。"
  rts-unavailable: "&c实时搜索在此版本不可用，请联系服主以寻求帮助。"
  # {0}: 当前服务器版本, {1}: 支持库最高版本
  rts-unavailable-version: "&c实时搜索在当前服务器版本 {0} 无法使用，实时搜索支持库最高支持版本为 {1}"
  rts-check-failed: "&c无法检查实时搜索，相关功能已禁用"
  rts-incompatible: "&c不兼容的版本! 无法使用实时搜索"
  rts-search-title: "在下方输入搜索内容"
  share:
    # {0}: 玩家名, {1}: 物品名
    message: "&a{0} &e分享了 &7[{1}&r&7]&e <点击搜索>"
    click-to-search: "&e点击搜索"

recipe-complete:
  plugin-disabled: "&cJustEnoughGuide 附属已被禁用，配方补全功能无法使用"
  # {0}: 取消原因
  cancelled: "&c[配方补全] 此次配方补全被取消，原因：{0}"
  cancelled-reason-unknown: "未知"
  no-space: "&c[配方补全] 没有足够的位置放置材料！"
  # {0}: 可放置份数, {1}: 目标份数, {2}: 百分比
  insufficient-space: "&e[配方补全] 可供放置材料的位置不足！至多放置 {0} / {1} 份材料！({2}%)"
  # {0}: 物品与数量描述
  cannot-place: "&c[配方补全] 无法放置物品: {0}"
