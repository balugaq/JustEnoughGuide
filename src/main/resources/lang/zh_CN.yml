    header:
      name: "&bJEG 使用指南"
      lore:
        - "&b作者: 大香蕉 (balugaq)"
        - "&bJEG 优化了粘液科技的指南，使其更人性化。"
        - "&b查看以下指南书以快速上手 JEG 增加的功能。"
    pinyin:
      name: "&b功能: 拼音搜索"
      lore:
        - "&b介绍: 你可以通过拼音搜索指南来快速找到你想要的物品。"
        - "&b点击尝试功能。"
    search-page:
      name: "&b功能: 搜索翻页"
      lore:
        - "&b介绍: 你可以在搜索中翻页来浏览更多搜索结果。"
        - "&b点击尝试功能。"
    bookmark:
      name: "&b功能: 标记物品"
      lore:
        - "&b介绍: 你可以打开一个物品组，对于支持的附属。"
        - "&b      你可以点击物品组界面下方的“书”图标以进入标记状态。"
        - "&a      点击返回按钮以退出标记状态。"
        - "&b点击尝试功能。"
    bookmark-view:
      name: "&b功能: 查阅标记物品"
      lore:
        - "&b介绍: 你可以查看你标记过的物品。"
        - "&b      你可以点击物品组界面下方的“下界之星”图标以查看标记过的物品。"
        - "&a      点击返回按钮以退出查看状态。"
        - "&b点击尝试功能。"
    jump-group:
      name: "&b功能: 跳转物品组"
      lore:
        - "&b介绍: 当你在查阅一个物品的配方时，你可以快速跳转到所需物品所属的物品组。"
        - "&b      你可以 Shift + 左键 点击所需物品，以快速跳转到该物品所属的物品组。"
        - "&b点击尝试功能。"
    quick-search:
      name: "&b功能: 快速搜索"
      lore:
        - "&b介绍: 当你在查阅一个物品的配方时，你可以快速搜索物品、材料、配方类型的名字"
